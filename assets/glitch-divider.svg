<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 64" role="img" aria-labelledby="t d"><title id="t">Glitch divider</title><desc id="d">A divider line with brief glitch slices and a crow perched in the middle: it tilts its head, flicks its tail, and its red eye brightens for a moment.</desc><style>
@keyframes slice1{0%,64%,72%,100%{transform:translate(0,0);opacity:.9}66%,70%{transform:translate(-7px,-3px);opacity:1}} .slice1{animation:slice1 6s linear infinite}
@keyframes slice2{0%,38%,46%,100%{transform:translate(0,0);opacity:.9}40%,44%{transform:translate(9px,3px);opacity:1}} .slice2{animation:slice2 6s linear infinite}
@keyframes headtilt{0%,30%,58%,100%{transform:rotate(0deg)}38%,50%{transform:rotate(-11deg)}} .headtilt{transform-box:fill-box;transform-origin:85% 85%;animation:headtilt 6.5s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes tailflick{0%,71%,100%{transform:rotate(0deg)}76%{transform:rotate(7deg)}82%{transform:rotate(-4deg)}88%{transform:rotate(0deg)}} .tailflick{transform-box:fill-box;transform-origin:0 50%;animation:tailflick 6.5s cubic-bezier(0.4,0,0.2,1) infinite}
@keyframes eyepulse{0%,88%,100%{opacity:.25}92%,96%{opacity:1}} .eyepulse{animation:eyepulse 6.5s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<line x1="8" y1="38" x2="330" y2="38" stroke="#a8894f" stroke-width="1.6" opacity="0.7"/>
<line x1="392" y1="38" x2="712" y2="38" stroke="#a8894f" stroke-width="1.6" opacity="0.7"/>
<rect class="slice1" x="120" y="36.6" width="52" height="2.8" fill="#e5484d" opacity="0.9"/>
<rect class="slice2" x="548" y="36.6" width="52" height="2.8" fill="#b9b2cc" opacity="0.9"/>
<g transform="translate(361 34)">
<path d="M-7 -2 L-7 4 M5 -2 L5 4" stroke="#232f4d" stroke-width="2"/>
<g class="tailflick"><path d="M17 -6 L46 3 L19 3 Z" fill="#232f4d"/></g>
<path d="M-27 -1 Q-29 -17 -11 -20 Q7 -23 17 -13 Q24 -6 20 -1 Z" fill="#232f4d"/>
<g class="headtilt"><circle cx="-21" cy="-17" r="8.5" fill="#232f4d"/>
<path d="M-29 -17 L-40 -13.5 L-29 -11 Z" fill="#232f4d"/>
<circle class="eyepulse" cx="-23.5" cy="-18.5" r="1.7" fill="#e5484d"/></g></g>
</svg>
