<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 96" role="img" aria-labelledby="t d"><title id="t">Ghost chase</title><desc id="d">A cute ghost chases a bug along a dotted path and shouts BOO! as it nearly catches it.</desc><style>
@keyframes run{0%{transform:translateX(-70px)}100%{transform:translateX(760px)}} .run{animation:run 7s linear infinite}
@keyframes rung{0%{transform:translateX(-170px)}100%{transform:translateX(660px)}} .rung{animation:rung 7s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}} .bob{animation:bob 0.9s ease-in-out infinite}
@keyframes legw{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}} .leg{transform-box:fill-box;transform-origin:top center;animation:legw 0.36s ease-in-out infinite}
@keyframes boo{0%,72%{opacity:0;transform:scale(0.6)}80%,90%{opacity:1;transform:scale(1.08)}97%,100%{opacity:0;transform:scale(1)}} .boo{transform-origin:618px 26px;animation:boo 7s linear infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}} .tw{animation:tw 3s ease-in-out infinite}
</style>
<line x1="6" y1="72" x2="714" y2="72" stroke="#c9c3d9" stroke-width="2.4" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.7"/>
<circle class="tw" style="animation-delay:0.0s" cx="120" cy="16" r="1.6" fill="#f8f1e6"/><circle class="tw" style="animation-delay:0.7s" cx="330" cy="10" r="1.4" fill="#f8f1e6"/><circle class="tw" style="animation-delay:1.4s" cx="560" cy="18" r="1.6" fill="#f8f1e6"/>
<g class="rung"><g class="bob"><g transform="translate(0 52) scale(0.95)"><path d="M0 -26 C -16 -26 -22 -12 -22 2 L -22 26 L -15 19 L -8 26 L 0 19 L 8 26 L 15 19 L 22 26 L 22 2 C 22 -12 16 -26 0 -26 Z" fill="#f4efe4"/><circle cx="-8" cy="-4" r="3.2" fill="#16213a"/><circle cx="8" cy="-4" r="3.2" fill="#16213a"/><ellipse cx="0" cy="5" rx="4" ry="5.5" fill="#16213a"/><circle cx="-14" cy="3" r="3.4" fill="#f2a65a" opacity="0.55"/><circle cx="14" cy="3" r="3.4" fill="#f2a65a" opacity="0.55"/></g></g></g>
<g class="run"><g transform="translate(0 58)">
<g class="leg"><path d="M-8 6 L-15 16 M0 8 L-1 18 M8 6 L14 16" stroke="#c3a36a" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
<ellipse cx="0" cy="0" rx="17" ry="11" fill="#1f2c4d"/><ellipse cx="9" cy="-2" rx="8" ry="7" fill="#c3a36a"/>
<circle cx="12" cy="-4" r="1.8" fill="#0d1526"/>
<path d="M14 -8 Q 22 -16 26 -14 M12 -9 Q 17 -18 22 -18" stroke="#c3a36a" stroke-width="2" fill="none" stroke-linecap="round"/>
</g></g>
<text class="boo" opacity="0" x="592" y="34" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" font-weight="700" fill="#f2a65a">BOO!</text>
</svg>
