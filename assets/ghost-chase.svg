<g class="speed"><path d="M636 44 L668 44 M644 56 L672 56" stroke="#f2a65a" stroke-width="3" stroke-linecap="round"/></g>
<g class="rung"><g class="hop"><g class="lunge"><g transform="translate(0 52) scale(0.95)"><path d="M0 -26 C -16 -26 -22 -12 -22 2 L -22 26 L -15 19 L -8 26 L 0 19 L 8 26 L 15 19 L 22 26 L 22 2 C 22 -12 16 -26 0 -26 Z" fill="#f4efe4"/><circle cx="-8" cy="-4" r="3.2" fill="#16213a"/><circle cx="8" cy="-4" r="3.2" fill="#16213a"/><ellipse cx="0" cy="5" rx="4" ry="5.5" fill="#16213a"/><circle cx="-14" cy="3" r="3.4" fill="#f2a65a" opacity="0.55"/><circle cx="14" cy="3" r="3.4" fill="#f2a65a" opacity="0.55"/></g></g></g></g>
<g class="run"><g transform="translate(0 58)"><g class="hop">
<g class="leg"><path d="M-8 6 L-15 16 M0 8 L-1 18 M8 6 L14 16" stroke="#c3a36a" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
<ellipse cx="0" cy="0" rx="17" ry="11" fill="#1f2c4d"/><ellipse cx="9" cy="-2" rx="8" ry="7" fill="#c3a36a"/>
<circle cx="12" cy="-4" r="1.8" fill="#0d1526"/>
<path d="M14 -8 Q 22 -16 26 -14 M12 -9 Q 17 -18 22 -18" stroke="#c3a36a" stroke-width="2" fill="none" stroke-linecap="round"/>
</g></g></g>
<g class="dust"><circle cx="96" cy="76" r="4" fill="#c9c3d9"/><circle cx="118" cy="79" r="3" fill="#c9c3d9"/></g>
<text class="boo" opacity="0" x="592" y="34" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" font-weight="700" fill="#f2a65a">BOO!</text>
</svg>
