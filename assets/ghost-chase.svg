<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 96" role="img" aria-labelledby="t d"><title id="t">Ghost chase</title><desc id="d">A ghost crouches, then chases a hopping bug, stretches into a lunge, and shouts BOO! with a springy pop as the bug squashes and escapes.</desc><style>@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}} .tw{animation:tw 3.4s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes run{0%{transform:translateX(-70px)}100%{transform:translateX(760px)}} .run{animation:run 7s cubic-bezier(0.22,1,0.36,1) infinite}
@keyframes rung{0%,6%{transform:translateX(-176px)}12%{transform:translateX(-168px)}100%{transform:translateX(654px)}} .rung{animation:rung 7s cubic-bezier(0.22,1,0.36,1) infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}22%{transform:translateY(-7px) scale(.96,1.05)}45%{transform:translateY(0) scale(1.08,.9)}70%{transform:translateY(-6px) scale(.97,1.04)}} .hop{animation:hop .9s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes lunge{0%,58%{transform:scale(1,1) rotate(0deg)}68%{transform:scale(1.13,.88) rotate(-4deg)}76%{transform:scale(.95,1.07) rotate(2deg)}84%,100%{transform:scale(1,1) rotate(0deg)}} .lunge{transform-box:fill-box;transform-origin:bottom center;animation:lunge 7s cubic-bezier(0.4,0,0.2,1) infinite}
@keyframes legw{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}} .leg{transform-box:fill-box;transform-origin:top center;animation:legw .32s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes boo{0%,70%{opacity:0;transform:scale(.5) rotate(4deg)}79%{opacity:1;transform:scale(1.12) rotate(-5deg)}86%{opacity:1;transform:scale(1) rotate(-3deg)}95%,100%{opacity:0;transform:scale(.92) rotate(-3deg)}} .boo{transform-origin:618px 26px;animation:boo 7s cubic-bezier(0.34,1.56,0.64,1) infinite}
@keyframes dust{0%,100%{opacity:0;transform:translateX(0) scale(.6)}50%{opacity:.5}} .dust{animation:dust 1.8s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes speed{0%,55%,100%{opacity:0}65%,85%{opacity:.75}} .speed{animation:speed 7s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<line x1="6" y1="72" x2="714" y2="72" stroke="#c9c3d9" stroke-width="2.4" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.7"/>
