<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 110" role="img" aria-labelledby="t d"><title id="t">Stickman hunt</title><desc id="d">A stickman with a flashlight walks in with a jointed walk cycle, startles back with a squash when a ghost pops up, then panic-walks past as it sinks away.</desc><style>@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}} .tw{animation:tw 3.4s cubic-bezier(0.37,0,0.63,1) infinite}.legL{transform-box:fill-box;transform-origin:100% 0;animation:swA .56s cubic-bezier(0.37,0,0.63,1) infinite}.legR{transform-box:fill-box;transform-origin:0 0;animation:swB .56s cubic-bezier(0.37,0,0.63,1) infinite}.armL{transform-box:fill-box;transform-origin:100% 0;animation:swB .56s cubic-bezier(0.37,0,0.63,1) infinite}.armR{transform-box:fill-box;transform-origin:0 0;animation:swA .56s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes swA{0%,100%{transform:rotate(17deg)}50%{transform:rotate(-17deg)}}@keyframes swB{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(17deg)}}
@keyframes walkx{0%{transform:translate(-46px,0)}54%{transform:translate(322px,0)}60%{transform:translate(304px,-9px) scale(1.06,.9)}66%{transform:translate(310px,0) scale(1,1)}100%{transform:translate(716px,0)}} .walkx{animation:walkx 8s cubic-bezier(0.22,1,0.36,1) infinite}
@keyframes bobw{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.6px)}} .bobw{animation:bobw .28s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes beamh{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}} .beamh{transform-box:fill-box;transform-origin:0 50%;animation:beamh 2.2s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes popghost{0%,50%{transform:translateY(30px);opacity:0}58%,74%{transform:translateY(0);opacity:1}82%,100%{transform:translateY(30px);opacity:0}} .popghost{animation:popghost 8s cubic-bezier(0.4,0,0.2,1) infinite}
@keyframes bang{0%,56%{opacity:0;transform:scale(.5) rotate(6deg)}63%,72%{opacity:1;transform:scale(1.1) rotate(-6deg)}78%,100%{opacity:0;transform:scale(.9)}} .bang{transform-origin:330px 18px;animation:bang 8s cubic-bezier(0.34,1.56,0.64,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
