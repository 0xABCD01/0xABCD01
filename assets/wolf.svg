<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 64" role="img" aria-labelledby="t d"><title id="t">Wolf</title><desc id="d">An angular wolf silhouette sits on a rock under an ember moon. Every few seconds it throws its head back to howl, and a small puff of ember breath escapes; its tail sways and its eye burns.</desc><defs></defs><style>@keyframes emberrise{0%{transform:translate(0,0);opacity:0}10%{opacity:.95}55%{transform:translate(7px,-52px)}100%{transform:translate(-5px,-104px);opacity:0}} .ember{animation:emberrise 6s linear infinite}@keyframes flick{0%,100%{transform:scale(1,1) skewX(0deg)}28%{transform:scale(.95,1.12) skewX(2.5deg)}57%{transform:scale(1.04,.93) skewX(-2deg)}79%{transform:scale(.98,1.07) skewX(1deg)}} .flick{transform-box:fill-box;transform-origin:bottom center;animation:flick 1.1s linear infinite}
@keyframes howl{0%,26%,58%,100%{transform:rotate(0deg)}34%,50%{transform:rotate(-16deg)}} .howl{transform-box:fill-box;transform-origin:18% 88%;animation:howl 9s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes puff{0%,32%{transform:translate(0,0);opacity:0}38%{opacity:.8}54%,100%{transform:translate(26px,-16px);opacity:0}} .puff{animation:puff 9s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes tailw{0%,100%{transform:rotate(0deg)}50%{transform:rotate(4deg)}} .tailw{transform-box:fill-box;transform-origin:100% 20%;animation:tailw 4.4s cubic-bezier(0.37,0,0.63,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
