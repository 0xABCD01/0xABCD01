<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t d"><title id="t">Watcher eyes</title><desc id="d">One pair of sharp, slanted eyes in the dark. The pupils track slowly side to side, and the blink is slow and heavy, with a red glint in each pupil.</desc><style>
@keyframes slowblink{0%,42%,58%,100%{transform:scaleY(1)}48%,53%{transform:scaleY(0.06)}} .eye2{transform-box:fill-box;transform-origin:center;animation:slowblink 7s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes track{0%,24%{transform:translate(-5px,0)}40%,60%{transform:translate(5px,0)}76%,100%{transform:translate(-5px,0)}} .track{animation:track 7s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}} .ring{transform-origin:100px 100px;animation:spin 34s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<circle cx="100" cy="100" r="97" fill="#05080f"/>
<circle class="ring" cx="100" cy="100" r="90" fill="none" stroke="#232f4d" stroke-width="2" stroke-dasharray="8 16"/>
<path d="M48 78 L94 88 M152 78 L106 88" stroke="#46587a" stroke-width="5" stroke-linecap="round"/>
<g class="eye2"><path d="M52 92 L92 99 L89 110 L55 104 Z" fill="#e8e2d4" opacity="0.94"/>
<path d="M148 92 L108 99 L111 110 L145 104 Z" fill="#e8e2d4" opacity="0.94"/>
<g class="track"><circle cx="72" cy="100" r="5.6" fill="#05080f"/><circle cx="128" cy="100" r="5.6" fill="#05080f"/>
<circle cx="72" cy="100" r="2" fill="#e5484d"/><circle cx="128" cy="100" r="2" fill="#e5484d"/></g></g>
<path d="M70 148 Q 100 140 130 148" stroke="#232f4d" stroke-width="2.4" fill="none" opacity="0.7"/>
</svg>
