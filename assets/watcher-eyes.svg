<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t d"><title id="t">Burning watcher eyes</title><desc id="d">Sharp slanted eyes in the dark with burning orange pupils, small flames flickering above the brows, embers drifting up, and a slow heavy blink.</desc><defs><radialGradient id="flameg" cx="50%" cy="92%" r="75%"><stop offset="0%" stop-color="#fff6c8"/><stop offset="30%" stop-color="#ffd23e"/><stop offset="55%" stop-color="#ff7b00"/><stop offset="80%" stop-color="#e63e00"/><stop offset="100%" stop-color="#a31e00" stop-opacity="0.92"/></radialGradient><filter id="fdist" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.035 0.11" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="fsoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter></defs><style>@keyframes glowf{0%,100%{opacity:.22}50%{opacity:.38}} .glowf{animation:glowf 2.3s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes flick{0%,100%{transform:scale(1,1) skewX(0deg)}28%{transform:scale(.95,1.12) skewX(2.5deg)}57%{transform:scale(1.04,.93) skewX(-2deg)}79%{transform:scale(.98,1.07) skewX(1deg)}} .flick{transform-box:fill-box;transform-origin:bottom center;animation:flick 1.1s linear infinite}@keyframes emberrise{0%{transform:translate(0,0);opacity:0}10%{opacity:.95}55%{transform:translate(7px,-52px)}100%{transform:translate(-5px,-104px);opacity:0}} .ember{animation:emberrise 6s linear infinite}
@keyframes slowblink{0%,42%,58%,100%{transform:scaleY(1)}48%,53%{transform:scaleY(0.06)}} .eye2{transform-box:fill-box;transform-origin:center;animation:slowblink 7s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes track{0%,24%{transform:translate(-5px,0)}40%,60%{transform:translate(5px,0)}76%,100%{transform:translate(-5px,0)}} .track{animation:track 7s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}} .ring{transform-origin:100px 100px;animation:spin 34s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
