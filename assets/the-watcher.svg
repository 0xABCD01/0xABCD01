<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 110" role="img" aria-labelledby="t d"><title id="t">The watcher</title><desc id="d">A broad watcher stands motionless on a hill split by glowing lava cracks, embers rising around him. After a long stillness his head turns and his eyes burn orange, hold, and go dark.</desc><defs></defs><style>@keyframes tw{0%,100%{opacity:.1}50%{opacity:.45}} .tw{animation:tw 4.4s cubic-bezier(0.37,0,0.63,1) infinite}.flap{transform-box:fill-box;transform-origin:center;animation:flap .6s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}@keyframes headturn{0%,38%,68%,100%{transform:translateX(0)}46%,60%{transform:translateX(3px)}} .headturn{animation:headturn 11s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes eyeglow{0%,40%,64%,100%{opacity:0}47%,58%{opacity:1}} .eyeglow{animation:eyeglow 11s cubic-bezier(0.4,0,0.2,1) infinite}@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.02)}} .breathe{transform-box:fill-box;transform-origin:bottom center;animation:breathe 5s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes emberrise{0%{transform:translate(0,0);opacity:0}10%{opacity:.95}55%{transform:translate(7px,-52px)}100%{transform:translate(-5px,-104px);opacity:0}} .ember{animation:emberrise 6s linear infinite}
@keyframes fogdrift2{0%{transform:translateX(-20px)}100%{transform:translateX(20px)}} .fogdrift2{animation:fogdrift2 12s cubic-bezier(0.37,0,0.63,1) infinite alternate}
@keyframes lavapulse{0%,100%{opacity:.3}50%{opacity:.85}} .lavapulse{animation:lavapulse 5s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes crowlate{0%{transform:translate(-120px,4px)}30%{transform:translate(180px,-6px)}55%,100%{transform:translate(860px,-2px)}} .crowlate{animation:crowlate 22s cubic-bezier(0.37,0,0.63,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
