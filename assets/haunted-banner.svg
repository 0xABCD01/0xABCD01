<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="t d"><title id="t">0xABCD01 haunted banner</title><desc id="d">A haunted night banner: a glowing full moon, flapping bats, a flickering haunted house, and a cute ghost that floats on an arc and jumps when the lightning strikes.</desc><style>@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}} .tw{animation:tw 3.4s cubic-bezier(0.37,0,0.63,1) infinite}.flap{transform-box:fill-box;transform-origin:center;animation:flap .55s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}
@keyframes moonglow{0%,100%{opacity:.3}50%{opacity:.65}} .mg{animation:moonglow 5s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-2deg)}30%{transform:translate(10px,-14px) rotate(2deg)}60%{transform:translate(-6px,-7px) rotate(-1deg)}} .drift{animation:drift 3.6s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes startle{0%,58%,74%,100%{transform:scale(1,1) translateY(0)}62%{transform:scale(1.16,.8) translateY(5px)}66%{transform:scale(.9,1.14) translateY(-15px)}70%{transform:scale(1.04,.96) translateY(-3px)}} .startle{transform-box:fill-box;transform-origin:bottom center;animation:startle 9s cubic-bezier(0.4,0,0.2,1) infinite}
@keyframes fly1{0%{transform:translate(-180px,10px)}35%{transform:translate(520px,-16px)}70%{transform:translate(1150px,8px)}100%{transform:translate(1780px,-40px)}} .fly1{animation:fly1 17s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes fly2{0%{transform:translate(-140px,-6px)}40%{transform:translate(700px,22px)}100%{transform:translate(1740px,-18px)}} .fly2{animation:fly2 23s cubic-bezier(0.37,0,0.63,1) infinite;animation-delay:-9s}
@keyframes flick{0%,100%{opacity:1}8%{opacity:.25}12%{opacity:1}46%{opacity:1}50%{opacity:.35}54%{opacity:1}78%{opacity:.5}82%{opacity:1}} .fl{animation:flick 4.2s linear infinite}
@keyframes flick2{0%,100%{opacity:.9}30%{opacity:.2}36%{opacity:.95}64%{opacity:.4}70%{opacity:.9}} .fl2{animation:flick2 5.1s linear infinite;animation-delay:-1.7s}
@keyframes flash{0%,60%,66%,100%{opacity:0}62%,64%{opacity:.5}} .flash{animation:flash 9s linear infinite}
@keyframes bolt{0%,60%,66%,100%{opacity:0}62%,64%{opacity:.95}} .bolt{animation:bolt 9s linear infinite}
@keyframes typeout{0%{transform:scaleX(0)}55%,100%{transform:scaleX(1)}} .ty{transform-origin:88px 0;animation:typeout 7s steps(26) infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}} .sway{transform-box:fill-box;transform-origin:top center;animation:sway 4.5s cubic-bezier(0.37,0,0.63,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
