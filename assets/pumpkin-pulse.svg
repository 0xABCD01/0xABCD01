<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 64" role="img" aria-labelledby="t d"><title id="t">Pumpkin row</title><desc id="d">A vine draws itself across, three jack-o'-lanterns pop in on a wave stagger and sway; their candle faces flicker and the middle one pops between a grin and a scary face.</desc><style>
@keyframes candle{0%,100%{opacity:1}22%{opacity:.45}30%{opacity:1}58%{opacity:.6}66%{opacity:1}84%{opacity:.5}92%{opacity:1}} .candle{animation:candle 3.8s linear infinite}
@keyframes swapA{0%,44%{opacity:1}52%,92%{opacity:0}100%{opacity:1}} .swapA{animation:swapA 7s linear infinite}
@keyframes swapB{0%,44%{opacity:0}52%,92%{opacity:1}100%{opacity:0}} .swapB{animation:swapB 7s linear infinite}
@keyframes facepop{0%,42%{transform:scale(1)}50%{transform:scale(1.1) rotate(-2deg)}58%,100%{transform:scale(1)}} .facepop{transform-box:fill-box;transform-origin:center;animation:facepop 7s cubic-bezier(0.34,1.56,0.64,1) infinite}
@keyframes swayp{0%,100%{transform:rotate(-2.4deg) translateY(0)}50%{transform:rotate(2.4deg) translateY(-2px)}} .swayp{transform-box:fill-box;transform-origin:bottom center;animation:swayp 5s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes popin{0%{transform:scale(0)}4%{transform:scale(1.12)}6%,100%{transform:scale(1)}} .popin{transform-box:fill-box;transform-origin:bottom center;animation:popin 21s cubic-bezier(0.34,1.56,0.64,1) infinite}
@keyframes drawvine{0%{stroke-dashoffset:760}7%,100%{stroke-dashoffset:0}} .drawvine{stroke-dasharray:760;animation:drawvine 21s cubic-bezier(0.22,1,0.36,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<path class="drawvine" d="M4 40 Q 90 26 180 38 T 360 38 T 540 38 T 716 36" stroke="#a9b9a4" stroke-width="2.2" fill="none" opacity="0.8"/>
<g class="popin" style="animation-delay:0.9s"><g class="swayp" style="animation-delay:2.70s"><g transform="translate(180 34)"><path d="M-2 -24 Q 0 -30 5 -31" stroke="#a9b9a4" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="27" ry="21" fill="#e07b39"/><ellipse cx="0" cy="0" rx="14" ry="20" fill="none" stroke="#c96a2e" stroke-width="2"/><ellipse cx="0" cy="0" rx="25" ry="20" fill="none" stroke="#c96a2e" stroke-width="2"/><g class="candle"><path d="M-13 -6 L-7 -13 L-1 -6 Z M13 -6 L7 -13 L1 -6 Z" fill="#f6e3b4"/><path d="M-13 6 L-8 11 L-3 6 L2 11 L7 6 L12 11 L10 3 L-11 3 Z" fill="#f6e3b4"/></g></g></g></g>
<g class="popin" style="animation-delay:1.05s"><g class="swayp" style="animation-delay:3.15s"><g transform="translate(360 34)"><path d="M-2 -24 Q 0 -30 5 -31" stroke="#a9b9a4" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="27" ry="21" fill="#e07b39"/><ellipse cx="0" cy="0" rx="14" ry="20" fill="none" stroke="#c96a2e" stroke-width="2"/><ellipse cx="0" cy="0" rx="25" ry="20" fill="none" stroke="#c96a2e" stroke-width="2"/><g class="facepop"><g class="swapA"><g class="candle"><path d="M-13 -6 L-7 -13 L-1 -6 Z M13 -6 L7 -13 L1 -6 Z" fill="#f6e3b4"/><path d="M-13 6 L-8 11 L-3 6 L2 11 L7 6 L12 11 L10 3 L-11 3 Z" fill="#f6e3b4"/></g></g><g class="swapB"><g class="candle"><path d="M-14 -5 L-6 -12 L-2 -4 Z M14 -5 L6 -12 L2 -4 Z" fill="#0d1526"/><path d="M-12 8 L-7 2 L-2 8 L3 2 L8 8 L12 3 L11 10 L-11 10 Z" fill="#0d1526"/></g></g></g></g></g></g>
