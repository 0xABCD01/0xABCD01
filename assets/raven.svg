<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 64" role="img" aria-labelledby="t d"><title id="t">Raven</title><desc id="d">A raven perched on a branch slowly turns its head to look, flicks its tail, and ruffles; two smaller crows sit further along, their red eyes brightening now and then.</desc><style>
@keyframes lookr{0%,26%,62%,100%{transform:rotate(0deg)}34%,54%{transform:rotate(13deg)}} .lookr{transform-box:fill-box;transform-origin:80% 85%;animation:lookr 8s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes tailf2{0%,80%,100%{transform:rotate(0deg)}85%{transform:rotate(6deg)}91%{transform:rotate(-3deg)}} .tailf2{transform-box:fill-box;transform-origin:0 50%;animation:tailf2 8s cubic-bezier(0.4,0,0.2,1) infinite}
@keyframes ruffle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.035)}} .ruffle{transform-box:fill-box;transform-origin:bottom center;animation:ruffle 4.6s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes eyepulse2{0%,91%,100%{opacity:.2}94%,97%{opacity:1}} .eyepulse2{animation:eyepulse2 9s linear infinite}
@keyframes eyepulse3{0%,78%,100%{opacity:.15}82%,86%{opacity:.9}} .eyepulse3{animation:eyepulse3 11s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
