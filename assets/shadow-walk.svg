<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 96" role="img" aria-labelledby="t d"><title id="t">Shadow walk</title><desc id="d">A stickman walks across, and his flattened shadow walks with him but out of sync, a half-step behind and never quite matching his stride.</desc><style>@keyframes tw{0%,100%{opacity:.12}50%{opacity:.5}} .tw{animation:tw 4.4s cubic-bezier(0.37,0,0.63,1) infinite}.legL{transform-box:fill-box;transform-origin:100% 0;animation:swA .56s cubic-bezier(0.37,0,0.63,1) infinite}.legR{transform-box:fill-box;transform-origin:0 0;animation:swB .56s cubic-bezier(0.37,0,0.63,1) infinite}.armL{transform-box:fill-box;transform-origin:100% 0;animation:swB .56s cubic-bezier(0.37,0,0.63,1) infinite}.armR{transform-box:fill-box;transform-origin:0 0;animation:swA .56s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes swA{0%,100%{transform:rotate(17deg)}50%{transform:rotate(-17deg)}}@keyframes swB{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(17deg)}}@keyframes bobw{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.6px)}} .bobw{animation:bobw .28s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes walkman{0%{transform:translateX(-46px)}100%{transform:translateX(716px)}} .walkman{animation:walkman 9s cubic-bezier(0.22,1,0.36,1) infinite}
@keyframes walkshadow{0%{transform:translateX(-88px)}100%{transform:translateX(668px)}} .walkshadow{animation:walkshadow 9s cubic-bezier(0.22,1,0.36,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<line x1="6" y1="86" x2="714" y2="86" stroke="#b9b2cc" stroke-width="2.2" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.55"/>
<circle class="tw" style="animation-delay:0.00s" cx="140" cy="12" r="1.4" fill="#e8e2d4" opacity="0.5"/><circle class="tw" style="animation-delay:0.83s" cx="420" cy="8" r="1.2" fill="#e8e2d4" opacity="0.5"/><circle class="tw" style="animation-delay:1.66s" cx="640" cy="16" r="1.4" fill="#e8e2d4" opacity="0.5"/>
<g transform="translate(0 88)"><g class="walkshadow" opacity="0.32"><g transform="scale(1 -0.5) skewX(-14)"><g transform="scale(1.0)" stroke="#05080f" stroke-width="3.4" stroke-linecap="round" fill="none"><circle cx="0" cy="-35" r="9.5" fill="none"/><line x1="0" y1="-26" x2="0" y2="0"/><g class="legL"><path d="M0 0 L-10 21"/></g><g class="legR"><path d="M0 0 L10 21"/></g><g class="armL"><path d="M0 -22 L-13 -7"/></g><g class="armR"><path d="M0 -22 L13 -7"/></g></g></g></g></g>
<g class="walkman"><g transform="translate(0 62)"><g class="bobw"><g transform="scale(1.0)" stroke="#232f4d" stroke-width="3.4" stroke-linecap="round" fill="none"><circle cx="0" cy="-35" r="9.5" fill="none"/><line x1="0" y1="-26" x2="0" y2="0"/><g class="legL"><path d="M0 0 L-10 21"/></g><g class="legR"><path d="M0 0 L10 21"/></g><g class="armL"><path d="M0 -22 L-13 -7"/></g><g class="armR"><path d="M0 -22 L13 -7"/></g></g></g></g></g>
