<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 110" role="img" aria-labelledby="t d"><title id="t">Shadow walk</title><desc id="d">A stickman walks through rising embers. His flattened shadow walks out of sync behind him, and halfway across, two burning eyes open inside the shadow and look back.</desc><defs></defs><style>@keyframes tw{0%,100%{opacity:.1}50%{opacity:.45}} .tw{animation:tw 4.4s cubic-bezier(0.37,0,0.63,1) infinite}.legL{transform-box:fill-box;transform-origin:100% 0;animation:swA .56s cubic-bezier(0.37,0,0.63,1) infinite}.legR{transform-box:fill-box;transform-origin:0 0;animation:swB .56s cubic-bezier(0.37,0,0.63,1) infinite}.armL{transform-box:fill-box;transform-origin:100% 0;animation:swB .56s cubic-bezier(0.37,0,0.63,1) infinite}.armR{transform-box:fill-box;transform-origin:0 0;animation:swA .56s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes swA{0%,100%{transform:rotate(17deg)}50%{transform:rotate(-17deg)}}@keyframes swB{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(17deg)}}@keyframes bobw{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.6px)}} .bobw{animation:bobw .28s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes emberrise{0%{transform:translate(0,0);opacity:0}10%{opacity:.95}55%{transform:translate(7px,-52px)}100%{transform:translate(-5px,-104px);opacity:0}} .ember{animation:emberrise 6s linear infinite}
@keyframes walkman{0%{transform:translateX(-46px)}100%{transform:translateX(716px)}} .walkman{animation:walkman 9s cubic-bezier(0.22,1,0.36,1) infinite}
@keyframes walkshadow{0%{transform:translateX(-88px)}100%{transform:translateX(668px)}} .walkshadow{animation:walkshadow 9s cubic-bezier(0.22,1,0.36,1) infinite}
@keyframes sheyes{0%,34%,62%,100%{opacity:0}40%,56%{opacity:1}} .sheyes{animation:sheyes 9s cubic-bezier(0.4,0,0.2,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<line x1="6" y1="84" x2="714" y2="84" stroke="#b9b2cc" stroke-width="2.2" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.45"/>
