<g transform="translate(0 86)"><g class="walkshadow" opacity="0.4"><g transform="scale(1 -0.34) skewX(-14)"><g transform="scale(1.0)" stroke="#030304" stroke-width="3.4" stroke-linecap="round" fill="none"><circle cx="0" cy="-35" r="9.5" fill="none"/><line x1="0" y1="-26" x2="0" y2="0"/><g class="legL"><path d="M0 0 L-10 21"/></g><g class="legR"><path d="M0 0 L10 21"/></g><g class="armL"><path d="M0 -22 L-13 -7"/></g><g class="armR"><path d="M0 -22 L13 -7"/></g></g>
<g class="sheyes" opacity="0"><circle cx="-3.4" cy="-35" r="2.4" fill="#ff8a3d"/><circle cx="3.4" cy="-35" r="2.4" fill="#ff8a3d"/></g></g></g></g>
<g class="walkman"><g transform="translate(0 60)"><g class="bobw"><g transform="scale(1.0)" stroke="#1d1d26" stroke-width="3.4" stroke-linecap="round" fill="none"><circle cx="0" cy="-35" r="9.5" fill="none"/><line x1="0" y1="-26" x2="0" y2="0"/><g class="legL"><path d="M0 0 L-10 21"/></g><g class="legR"><path d="M0 0 L10 21"/></g><g class="armL"><path d="M0 -22 L-13 -7"/></g><g class="armR"><path d="M0 -22 L13 -7"/></g></g></g></g></g>
