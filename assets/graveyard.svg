<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" role="img" aria-labelledby="t d"><title id="t">Graveyard</title><desc id="d">A graveyard at night: a ghost rises on a swaying arc from behind a tombstone marked BUGS, hovers, and sinks back; fog drifts slowly and a bat swings upside down from a dead tree.</desc><style>@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}} .tw{animation:tw 3.4s cubic-bezier(0.37,0,0.63,1) infinite}.flap{transform-box:fill-box;transform-origin:center;animation:flap .55s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}
@keyframes rise{0%,12%{transform:translate(0,26px) rotate(0deg);opacity:0}26%{transform:translate(-4px,-3px) rotate(-3deg);opacity:1}34%,56%{transform:translate(3px,-6px) rotate(2deg);opacity:1}72%,100%{transform:translate(0,26px) rotate(0deg);opacity:0}} .rise{animation:rise 10s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes fogmove{0%{transform:translateX(-46px)}100%{transform:translateX(46px)}} .fogm{animation:fogmove 18s cubic-bezier(0.37,0,0.63,1) infinite alternate}
@keyframes fogmove2{0%{transform:translateX(38px)}100%{transform:translateX(-38px)}} .fogm2{animation:fogmove2 24s cubic-bezier(0.37,0,0.63,1) infinite alternate}
@keyframes blinkg{0%,90%,100%{opacity:1}94%{opacity:0}} .blinkg{animation:blinkg 5.4s linear infinite}
@keyframes hang{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-6deg)}} .hang{transform-origin:118px 26px;animation:hang 4.2s cubic-bezier(0.37,0,0.63,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
