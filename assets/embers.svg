<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 84" role="img" aria-labelledby="t d"><title id="t">Embers</title><desc id="d">Dark smoke layers drift against each other through rising embers, and far behind them a small figure walks with two burning eyes, half hidden, never hurrying.</desc><defs><radialGradient id="flameg" cx="50%" cy="92%" r="75%"><stop offset="0%" stop-color="#fff6c8"/><stop offset="30%" stop-color="#ffd23e"/><stop offset="55%" stop-color="#ff7b00"/><stop offset="80%" stop-color="#e63e00"/><stop offset="100%" stop-color="#a31e00" stop-opacity="0.92"/></radialGradient><filter id="fdist" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.035 0.11" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="fsoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter></defs><style>@keyframes emberrise{0%{transform:translate(0,0);opacity:0}10%{opacity:.95}55%{transform:translate(7px,-52px)}100%{transform:translate(-5px,-104px);opacity:0}} .ember{animation:emberrise 6s linear infinite}.legL{transform-box:fill-box;transform-origin:100% 0;animation:swA .56s cubic-bezier(0.37,0,0.63,1) infinite}.legR{transform-box:fill-box;transform-origin:0 0;animation:swB .56s cubic-bezier(0.37,0,0.63,1) infinite}.armL{transform-box:fill-box;transform-origin:100% 0;animation:swB .56s cubic-bezier(0.37,0,0.63,1) infinite}.armR{transform-box:fill-box;transform-origin:0 0;animation:swA .56s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes swA{0%,100%{transform:rotate(17deg)}50%{transform:rotate(-17deg)}}@keyframes swB{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(17deg)}}@keyframes bobw{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.6px)}} .bobw{animation:bobw .28s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes drift1{from{transform:translateX(0)}to{transform:translateX(-360px)}} .d1{animation:drift1 34s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes drift2{from{transform:translateX(-360px)}to{transform:translateX(0)}} .d2{animation:drift2 46s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes farwalk{0%{transform:translateX(-40px)}100%{transform:translateX(760px)}} .farwalk{animation:farwalk 30s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes farpulse{0%,100%{opacity:.55}50%{opacity:1}} .farpulse{animation:farpulse 3.4s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes ashfall{0%{transform:translate(0,-6px);opacity:0}18%{opacity:.5}100%{transform:translate(-16px,64px);opacity:0}} .ashfall{animation:ashfall 9s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
