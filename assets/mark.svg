<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 40" role="img" aria-labelledby="t d"><title>Constellation mark</title><desc>Three linked nodes with a small sparkle, blinking gently.</desc>  <style>
  @keyframes mblink {
