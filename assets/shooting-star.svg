<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 190" role="img" aria-labelledby="t d"><title>Shooting star</title><desc>A night-sky panel with a crescent moon, twinkling stars and a small constellation, while two meteors streak across leaving glowing trails.</desc>
  <style>
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes shoot {
      0% { transform: translate(228px, 14px); opacity: 0; }
      5% { opacity: 1; }
      33% { transform: translate(28px, 140px); opacity: 1; }
      41% { transform: translate(2px, 156px); opacity: 0; }
      100% { transform: translate(2px, 156px); opacity: 0; }
    }
    @keyframes shoot2 {
      0% { transform: translate(246px, 52px); opacity: 0; }
      5% { opacity: 0.9; }
      30% { transform: translate(96px, 148px); opacity: 0.9; }
      38% { transform: translate(74px, 162px); opacity: 0; }
      100% { transform: translate(74px, 162px); opacity: 0; }
    }
    @keyframes moonpulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }
    .meteor { animation: shoot 9s linear infinite; }
    .meteor2 { animation: shoot2 13s linear infinite; animation-delay: -6.5s; }
    .tw { animation: twinkle 3.4s ease-in-out infinite; }
    .tw2 { animation-delay: 0.8s; } .tw3 { animation-delay: 1.6s; } .tw4 { animation-delay: 2.3s; } .tw5 { animation-delay: 2.9s; }
    .moonhalo { animation: moonpulse 5s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdf6e3" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#c3a36a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#c3a36a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="headglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf6e3" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#c3a36a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c3a36a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f1e6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f8f1e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- night panel -->
  <rect x="1" y="1" width="258" height="188" rx="18" fill="#16233c"/>
  <rect x="1" y="1" width="258" height="188" rx="18" fill="none" stroke="#c3a36a" stroke-opacity="0.22"/>

  <!-- crescent moon -->
  <circle class="moonhalo" cx="38" cy="36" r="24" fill="url(#moonglow)"/>
  <circle cx="38" cy="36" r="13" fill="#f8f1e6"/>
  <circle cx="44" cy="32" r="11" fill="#16233c"/>

  <!-- constellation, echoing the banner -->
  <g stroke="#c9c3d9" stroke-opacity="0.35" stroke-width="1">
    <line x1="192" y1="30" x2="212" y2="45"/>
    <line x1="212" y1="45" x2="230" y2="25"/>
    <line x1="230" y1="25" x2="243" y2="47"/>
  </g>
  <g fill="#c3a36a">
    <circle cx="192" cy="30" r="2"/>
    <circle cx="212" cy="45" r="2.3"/>
    <circle cx="230" cy="25" r="1.8"/>
    <circle cx="243" cy="47" r="2"/>
  </g>

  <!-- star field -->
  <g>
    <circle class="tw" cx="86" cy="28" r="1.7" fill="#f8f1e6"/>
    <circle class="tw tw2" cx="128" cy="52" r="1.3" fill="#c9c3d9"/>
    <circle class="tw tw3" cx="66" cy="72" r="1.5" fill="#c3a36a"/>
    <circle class="tw tw4" cx="168" cy="76" r="1.6" fill="#f8f1e6"/>
    <circle class="tw tw5" cx="104" cy="96" r="1.2" fill="#c9c3d9"/>
    <circle class="tw tw2" cx="222" cy="102" r="1.5" fill="#f8f1e6"/>
    <circle class="tw tw3" cx="38" cy="118" r="1.3" fill="#c9c3d9"/>
    <circle class="tw tw4" cx="146" cy="126" r="1.2" fill="#c3a36a"/>
    <circle class="tw" cx="196" cy="150" r="1.4" fill="#c9c3d9"/>
    <circle class="tw tw5" cx="78" cy="150" r="1.2" fill="#f8f1e6"/>
  </g>
  <path class="tw tw2" d="M112 20 C112 23 113 24 116 24 C113 24 112 25 112 28 C112 25 111 24 108 24 C111 24 112 23 112 20 Z" fill="#c3a36a"/>
  <path class="tw tw4" d="M52 92 C52 94.6 52.9 95.5 55.5 95.5 C52.9 95.5 52 96.4 52 99 C52 96.4 51.1 95.5 48.5 95.5 C51.1 95.5 52 94.6 52 92 Z" fill="#c9c3d9"/>

  <!-- pine silhouettes -->
  <g fill="#0e1830">
    <path d="M206 190 L218 158 L224 172 L217 172 L228 190 Z"/>
    <path d="M228 190 L242 148 L249 166 L241 166 L254 190 Z"/>
    <path d="M14 190 L24 166 L29 178 L23 178 L32 190 Z"/>
  </g>

  <!-- second, smaller meteor -->
  <g class="meteor2" opacity="0">
    <g transform="rotate(-32) scale(0.55)">
      <path d="M0 -3 L92 -0.6 L92 0.6 L0 3 Z" fill="url(#trail)"/>
      <circle cx="0" cy="0" r="10" fill="url(#headglow)"/>
      <circle cx="0" cy="0" r="3.6" fill="#fdf6e3"/>
    </g>
  </g>

  <!-- main meteor -->
  <g class="meteor" opacity="0">
    <g transform="rotate(-32)">
      <path d="M0 -3.8 L118 -0.7 L118 0.7 L0 3.8 Z" fill="url(#trail)"/>
      <circle class="tw3" cx="34" cy="-3" r="1.5" fill="#f8f1e6"/>
      <circle class="tw" cx="58" cy="2.5" r="1.2" fill="#c3a36a"/>
      <circle class="tw5" cx="80" cy="-2" r="1" fill="#f8f1e6"/>
      <circle cx="0" cy="0" r="15" fill="url(#headglow)"/>
      <circle cx="0" cy="0" r="4.6" fill="#fdf6e3"/>
      <path class="tw" d="M0 -11 C0.8 -4 4 -0.8 11 0 C4 0.8 0.8 4 0 11 C-0.8 4 -4 0.8 -11 0 C-4 -0.8 -0.8 -4 0 -11 Z" fill="#f8f1e6"/>
    </g>
  </g>
</svg>
