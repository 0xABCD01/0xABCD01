<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 84" role="img" aria-labelledby="t d"><title id="t">Mist</title><desc id="d">Slow layers of mist drift against each other, and far behind them a small dark figure walks through, half hidden, never hurrying.</desc><style>
@keyframes drift1{from{transform:translateX(0)}to{transform:translateX(-360px)}} .d1{animation:drift1 34s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes drift2{from{transform:translateX(-360px)}to{transform:translateX(0)}} .d2{animation:drift2 46s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes farwalk{0%{transform:translateX(-40px)}100%{transform:translateX(760px)}} .farwalk{animation:farwalk 30s cubic-bezier(0.37,0,0.63,1) infinite}
.legL{transform-box:fill-box;transform-origin:100% 0;animation:swA .56s cubic-bezier(0.37,0,0.63,1) infinite}.legR{transform-box:fill-box;transform-origin:0 0;animation:swB .56s cubic-bezier(0.37,0,0.63,1) infinite}.armL{transform-box:fill-box;transform-origin:100% 0;animation:swB .56s cubic-bezier(0.37,0,0.63,1) infinite}.armR{transform-box:fill-box;transform-origin:0 0;animation:swA .56s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes swA{0%,100%{transform:rotate(17deg)}50%{transform:rotate(-17deg)}}@keyframes swB{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(17deg)}}@keyframes bobw{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.6px)}} .bobw{animation:bobw .28s cubic-bezier(0.37,0,0.63,1) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g class="d1"><path d="M0 34 Q 90 18 180 34 T 360 34 T 540 34 T 720 34 T 900 34 T 1080 34 L1080 84 L0 84 Z" fill="#b9b2cc" opacity="0.26"/></g>
<g class="farwalk" opacity="0.55"><g transform="translate(0 44)"><g transform="scale(0.8)" stroke="#05080f" stroke-width="3.4" stroke-linecap="round" fill="none"><circle cx="0" cy="-35" r="9.5" fill="none"/><line x1="0" y1="-26" x2="0" y2="0"/><g class="legL"><path d="M0 0 L-10 21"/></g><g class="legR"><path d="M0 0 L10 21"/></g><g class="armL"><path d="M0 -22 L-13 -7"/></g><g class="armR"><path d="M0 -22 L13 -7"/></g></g></g></g>
