<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="880" height="140" role="img" aria-label="A busy animated night sky: a constellation that keeps redrawing itself, pulsing stars, drifting sparks, a comet on patrol, and frequent shooting stars">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3a36a" stop-opacity="0"/>
      <stop offset="1" stop-color="#c3a36a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="trailBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c3d9" stop-opacity="0"/>
      <stop offset="1" stop-color="#c9c3d9" stop-opacity="0.9"/>
    </linearGradient>
    <path id="sparkle" d="M0,-9 L2.2,-2.2 L9,0 L2.2,2.2 L0,9 L-2.2,2.2 L-9,0 L-2.2,-2.2 Z"/>
  </defs>

  <!-- constellation line, redraws itself on a brisk loop -->
  <polyline points="70,95 190,55 320,85 450,40 585,78 705,45 815,80"
            fill="none" stroke="#b8935a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="1010" stroke-dashoffset="1010" opacity="0.75">
    <animate attributeName="stroke-dashoffset" values="1010;0;0;1010" keyTimes="0;0.3;0.8;1" dur="9s" repeatCount="indefinite"/>
  </polyline>

  <!-- pulse rings radiating from the brightest nodes -->
  <g fill="none" stroke="#c3a36a">
    <circle cx="320" cy="85" r="3">
      <animate attributeName="r" values="3;16" dur="2.8s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="585" cy="78" r="3">
      <animate attributeName="r" values="3;15" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="95" r="3">
      <animate attributeName="r" values="3;13" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="815" cy="80" r="3">
      <animate attributeName="r" values="3;13" dur="3.4s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3.4s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- constellation nodes -->
  <g fill="#c3a36a">
    <circle cx="70" cy="95" r="3.2"><animate attributeName="opacity" values="1;0.35;1" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="55" r="2.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="85" r="3.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="40" r="2.6"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="585" cy="78" r="3.2"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="705" cy="45" r="2.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="815" cy="80" r="3.2"><animate attributeName="opacity" values="1;0.35;1" dur="2.5s" begin="1.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- dense field stars, lavender and sage -->
  <g>
    <circle cx="120" cy="30" r="1.7" fill="#c9c3d9"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="255" cy="115" r="1.5" fill="#a9b9a4"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="385" cy="22" r="1.6" fill="#c9c3d9"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="112" r="1.7" fill="#a9b9a4"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="648" cy="24" r="1.5" fill="#c9c3d9"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.9s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="762" cy="118" r="1.6" fill="#a9b9a4"><animate attributeName="opacity" values="0.85;0.25;0.85" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="48" r="1.5" fill="#c9c3d9"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="848" cy="34" r="1.7" fill="#c9c3d9"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="122" r="1.4" fill="#c9c3d9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="34" r="1.4" fill="#a9b9a4"><animate attributeName="opacity" values="0.95;0.2;0.95" dur="2.5s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="68" r="1.3" fill="#c9c3d9"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="612" cy="122" r="1.4" fill="#c9c3d9"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.2s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="726" cy="86" r="1.3" fill="#a9b9a4"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="2.1s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="98" cy="70" r="1.3" fill="#a9b9a4"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="556" cy="30" r="1.4" fill="#a9b9a4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="118" r="1.3" fill="#c9c3d9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.9s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sparks drifting slowly upward -->
  <g fill="#c3a36a">
    <circle cx="210" cy="0" r="1.6" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0,138;0,6" dur="13s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.15;0.8;1" dur="13s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="668" cy="0" r="1.4" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0,138;0,10" dur="16s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.15;0.8;1" dur="16s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="0" r="1.5" fill="#c9c3d9" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0,138;0,4" dur="18s" begin="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0.75;0" keyTimes="0;0.15;0.8;1" dur="18s" begin="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- pulsing sparkles -->
  <g transform="translate(450,40)">
    <g fill="#c3a36a">
      <use href="#sparkle"/>
      <animateTransform attributeName="transform" type="scale" values="0.55;1.2;0.55" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(120,30)">
    <g fill="#c9c3d9">
      <use href="#sparkle" transform="scale(0.7)"/>
      <animateTransform attributeName="transform" type="scale" values="1;0.45;1" dur="2.9s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2.9s" begin="0.3s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(762,118)">
    <g fill="#a9b9a4">
      <use href="#sparkle" transform="scale(0.6)"/>
      <animateTransform attributeName="transform" type="scale" values="0.5;1.1;0.5" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(648,24)">
    <g fill="#c3a36a">
      <use href="#sparkle" transform="scale(0.55)"/>
      <animateTransform attributeName="transform" type="scale" values="0.5;1.1;0.5" dur="3.1s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" begin="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(255,115)">
    <g fill="#c9c3d9">
      <use href="#sparkle" transform="scale(0.5)"/>
      <animateTransform attributeName="transform" type="scale" values="1.05;0.5;1.05" dur="2.7s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.3;0.95" dur="2.7s" begin="0.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- comet on patrol: one slow lap of the whole band, trailing lavender -->
  <g>
    <line x1="-52" y1="0" x2="0" y2="0" stroke="url(#trailBack)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.8" fill="#efe9f7"/>
    <animateMotion dur="22s" repeatCount="indefinite" rotate="auto" path="M-70,108 C200,20 420,132 620,44 C740,0 830,30 950,58"/>
  </g>

  <!-- shooting star 1 -->
  <g opacity="0">
    <line x1="-64" y1="0" x2="0" y2="0" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.4" fill="#e8dcc0"/>
    <animateMotion dur="7s" repeatCount="indefinite" path="M120,18 L560,86" keyPoints="0;1;1" keyTimes="0;0.16;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.12;0.17;1" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- shooting star 2: opposite direction -->
  <g opacity="0">
    <line x1="64" y1="0" x2="0" y2="0" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.2" fill="#e8dcc0"/>
    <animateMotion dur="9s" begin="3s" repeatCount="indefinite" path="M790,26 L330,96" keyPoints="0;1;1" keyTimes="0;0.13;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.1;0.14;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </g>

  <!-- shooting star 3: short hop, lower sky -->
  <g opacity="0">
    <line x1="-48" y1="0" x2="0" y2="0" stroke="url(#trail)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#e8dcc0"/>
    <animateMotion dur="11s" begin="5.5s" repeatCount="indefinite" path="M240,124 L600,58" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.08;0.11;1" dur="11s" begin="5.5s" repeatCount="indefinite"/>
  </g>

  <!-- shooting star 4: steep drop -->
  <g opacity="0">
    <line x1="-40" y1="-30" x2="0" y2="0" stroke="url(#trail)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#e8dcc0"/>
    <animateMotion dur="13s" begin="8s" repeatCount="indefinite" path="M700,8 L610,120" keyPoints="0;1;1" keyTimes="0;0.09;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.07;0.1;1" dur="13s" begin="8s" repeatCount="indefinite"/>
  </g>
</svg>
