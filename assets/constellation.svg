<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="880" height="140" role="img" aria-label="An animated constellation: twinkling stars, a line that draws itself between them, and the occasional shooting star">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3a36a" stop-opacity="0"/>
      <stop offset="1" stop-color="#c3a36a" stop-opacity="0.9"/>
    </linearGradient>
    <path id="sparkle" d="M0,-9 L2.2,-2.2 L9,0 L2.2,2.2 L0,9 L-2.2,2.2 L-9,0 L-2.2,-2.2 Z"/>
  </defs>

  <!-- constellation line, draws itself then rests, loop -->
  <polyline points="70,95 190,55 320,85 450,40 585,78 705,45 815,80"
            fill="none" stroke="#b8935a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="1010" stroke-dashoffset="1010" opacity="0.75">
    <animate attributeName="stroke-dashoffset" values="1010;0;0;1010" keyTimes="0;0.35;0.85;1" dur="14s" repeatCount="indefinite"/>
  </polyline>

  <!-- constellation nodes -->
  <g fill="#c3a36a">
    <circle cx="70" cy="95" r="3.2"><animate attributeName="opacity" values="1;0.35;1" dur="3.1s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="55" r="2.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="85" r="3.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="40" r="2.6"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="585" cy="78" r="3.2"><animate attributeName="opacity" values="1;0.4;1" dur="3.4s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="705" cy="45" r="2.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="815" cy="80" r="3.2"><animate attributeName="opacity" values="1;0.35;1" dur="3.6s" begin="1.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- scattered field stars, lavender and sage -->
  <g>
    <circle cx="120" cy="30" r="1.7" fill="#c9c3d9"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="4.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="255" cy="115" r="1.5" fill="#a9b9a4"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="385" cy="22" r="1.6" fill="#c9c3d9"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.7s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="112" r="1.7" fill="#a9b9a4"><animate attributeName="opacity" values="1;0.3;1" dur="3.9s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="648" cy="24" r="1.5" fill="#c9c3d9"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="4.4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="762" cy="118" r="1.6" fill="#a9b9a4"><animate attributeName="opacity" values="0.85;0.25;0.85" dur="3.5s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="48" r="1.5" fill="#c9c3d9"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="848" cy="34" r="1.7" fill="#c9c3d9"><animate attributeName="opacity" values="1;0.3;1" dur="4.9s" begin="0.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- pulsing sparkles -->
  <g transform="translate(450,40)">
    <g fill="#c3a36a">
      <use href="#sparkle"/>
      <animateTransform attributeName="transform" type="scale" values="0.55;1.15;0.55" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(120,30)">
    <g fill="#c9c3d9">
      <use href="#sparkle" transform="scale(0.7)"/>
      <animateTransform attributeName="transform" type="scale" values="1;0.45;1" dur="4.2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="4.2s" begin="0.3s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(762,118)">
    <g fill="#a9b9a4">
      <use href="#sparkle" transform="scale(0.6)"/>
      <animateTransform attributeName="transform" type="scale" values="0.5;1.05;0.5" dur="3.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="3.5s" begin="0.9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- shooting star 1: crosses upper sky roughly every 11s -->
  <g opacity="0">
    <line x1="-64" y1="0" x2="0" y2="0" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.4" fill="#e8dcc0"/>
    <animateMotion dur="11s" repeatCount="indefinite" path="M120,18 L560,86" keyPoints="0;1;1" keyTimes="0;0.14;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.11;0.15;1" dur="11s" repeatCount="indefinite"/>
  </g>

  <!-- shooting star 2: opposite direction, rarer -->
  <g opacity="0">
    <line x1="64" y1="0" x2="0" y2="0" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.2" fill="#e8dcc0"/>
    <animateMotion dur="17s" begin="6s" repeatCount="indefinite" path="M790,26 L330,96" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.08;0.11;1" dur="17s" begin="6s" repeatCount="indefinite"/>
  </g>
</svg>
