<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t d"><title id="t">Eyes in the dark</title><desc id="d">Pairs of eyes blink in the dark and glance side to side while a small ghost bobs below them.</desc><style>
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(0.08)}97%{transform:scaleY(1)}} .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s ease-in-out infinite}
@keyframes look{0%,22%{transform:translateX(-4px)}38%,62%{transform:translateX(4px)}78%,100%{transform:translateX(-4px)}} .pupil{animation:look 5.2s ease-in-out infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}} .ring{transform-origin:100px 100px;animation:spin 26s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}} .bob{animation:bob 3.4s ease-in-out infinite}
</style>
<circle cx="100" cy="100" r="97" fill="#0d1526"/>
<circle class="ring" cx="100" cy="100" r="90" fill="none" stroke="#c3a36a" stroke-width="2" stroke-dasharray="10 14" opacity="0.8"/>
<g class="eye" style="animation-delay:0s"><g transform="translate(100 62) scale(1.0)"><ellipse cx="-17" cy="0" rx="13" ry="9" fill="#f8f1e6"/><ellipse cx="17" cy="0" rx="13" ry="9" fill="#f8f1e6"/><g class="pupil"><circle cx="-17" cy="0" r="4.6" fill="#16213a"/><circle cx="17" cy="0" r="4.6" fill="#16213a"/></g></g></g>
<g class="eye" style="animation-delay:-1.6s"><g transform="translate(72 108) scale(0.72)"><ellipse cx="-17" cy="0" rx="13" ry="9" fill="#f8f1e6"/><ellipse cx="17" cy="0" rx="13" ry="9" fill="#f8f1e6"/><g class="pupil"><circle cx="-17" cy="0" r="4.6" fill="#16213a"/><circle cx="17" cy="0" r="4.6" fill="#16213a"/></g></g></g>
<g class="eye" style="animation-delay:-3.1s"><g transform="translate(134 116) scale(0.55)"><ellipse cx="-17" cy="0" rx="13" ry="9" fill="#f8f1e6"/><ellipse cx="17" cy="0" rx="13" ry="9" fill="#f8f1e6"/><g class="pupil"><circle cx="-17" cy="0" r="4.6" fill="#16213a"/><circle cx="17" cy="0" r="4.6" fill="#16213a"/></g></g></g>
<g class="bob"><g transform="translate(100 164) scale(0.62)"><path d="M0 -26 C -16 -26 -22 -12 -22 2 L -22 26 L -15 19 L -8 26 L 0 19 L 8 26 L 15 19 L 22 26 L 22 2 C 22 -12 16 -26 0 -26 Z" fill="#f4efe4"/><circle cx="-8" cy="-4" r="3.2" fill="#16213a"/><circle cx="8" cy="-4" r="3.2" fill="#16213a"/><ellipse cx="0" cy="5" rx="4" ry="5.5" fill="#16213a"/><circle cx="-14" cy="3" r="3.4" fill="#f2a65a" opacity="0.55"/><circle cx="14" cy="3" r="3.4" fill="#f2a65a" opacity="0.55"/></g></g>
</svg>
