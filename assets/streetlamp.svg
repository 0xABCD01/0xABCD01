<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 190" role="img" aria-labelledby="t d"><title id="t">Streetlamp</title><desc id="d">A streetlamp that dips once every few seconds, a moth circling its head, and a watcher standing at the edge of the light whose head turns and whose red eyes open briefly.</desc><style>@keyframes headturn{0%,38%,68%,100%{transform:translateX(0)}46%,60%{transform:translateX(3px)}} .headturn{animation:headturn 11s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes eyeglow{0%,40%,64%,100%{opacity:0}47%,58%{opacity:1}} .eyeglow{animation:eyeglow 11s cubic-bezier(0.4,0,0.2,1) infinite}@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.02)}} .breathe{transform-box:fill-box;transform-origin:bottom center;animation:breathe 5s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes lampglow{0%,100%{opacity:.16}50%{opacity:.2}} .lampglow{animation:lampglow 5s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes lampdip{0%,49%,55%,100%{opacity:1}51%,53%{opacity:.25}} .lampdip{animation:lampdip 7s linear infinite}
@keyframes moth{from{transform:rotate(0deg)}to{transform:rotate(360deg)}} .moth{transform-origin:64px 44px;animation:moth 3.8s linear infinite}
@keyframes fogdrift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}} .fogdrift{animation:fogdrift 9s cubic-bezier(0.37,0,0.63,1) infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="260" height="190" rx="14" fill="#0d1322"/>
<circle class="tw" style="animation-delay:0.00s" cx="200" cy="24" r="1.4" fill="#e8e2d4" opacity="0.5"/><circle class="tw" style="animation-delay:0.83s" cx="232" cy="58" r="1.2" fill="#e8e2d4" opacity="0.5"/><circle class="tw" style="animation-delay:1.66s" cx="168" cy="40" r="1.1" fill="#e8e2d4" opacity="0.5"/>
<polygon class="lampglow" opacity="0.18" points="64,52 22,178 118,178" fill="#e9dfc4"/>
<g class="lampdip"><rect x="61" y="46" width="7" height="132" fill="#232f4d"/>
<path d="M50 48 L79 48 L71 32 L58 32 Z" fill="#232f4d"/><circle cx="64" cy="44" r="5.5" fill="#e9dfc4"/></g>
<g class="moth"><circle cx="64" cy="30" r="2" fill="#b9b2cc" opacity="0.8"/></g>
<g transform="translate(186 158)"><g class="breathe"><g transform="scale(1.05)" stroke="#232f4d" stroke-width="3.6" stroke-linecap="round" fill="none"><line x1="0" y1="-25" x2="0" y2="0"/><line x1="0" y1="0" x2="-9" y2="21"/><line x1="0" y1="0" x2="9" y2="21"/><line x1="0" y1="-21" x2="-12" y2="-6"/><line x1="0" y1="-21" x2="12" y2="-6"/></g><g class="headturn"><circle cx="0" cy="-36.75" r="9.975" fill="#232f4d"/><g class="eyeglow" opacity="0"><circle cx="-3.57" cy="-36.75" r="1.5" fill="#e5484d"/><circle cx="3.57" cy="-36.75" r="1.5" fill="#e5484d"/></g></g></g></g>
<ellipse class="fogdrift" cx="130" cy="180" rx="120" ry="8" fill="#b9b2cc" opacity="0.10"/>
<rect y="178" width="260" height="12" fill="#05080f"/>
</svg>
