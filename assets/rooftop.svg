<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" role="img" aria-labelledby="t d"><title id="t">Rooftop watcher</title><desc id="d">A night skyline with a few flickering windows. A lone figure stands on the tallest roof, coat fluttering, watching the city while fog drifts below and a crow crosses the moon.</desc><style>@keyframes tw{0%,100%{opacity:.12}50%{opacity:.5}} .tw{animation:tw 4.4s cubic-bezier(0.37,0,0.63,1) infinite}.flap{transform-box:fill-box;transform-origin:center;animation:flap .6s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
@keyframes winflick{0%,100%{opacity:.75}42%{opacity:.3}48%{opacity:.8}70%{opacity:.45}76%{opacity:.75}} .winflick{animation:winflick 6.4s linear infinite}
@keyframes flutter{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}} .flutter{transform-box:fill-box;transform-origin:top center;animation:flutter 3.4s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes fogmove3{0%{transform:translateX(-36px)}100%{transform:translateX(36px)}} .fogmove3{animation:fogmove3 16s cubic-bezier(0.37,0,0.63,1) infinite alternate}
@keyframes crowroof{0%{transform:translate(-130px,2px)}40%{transform:translate(330px,-8px)}100%{transform:translate(1010px,0)}} .crowroof{animation:crowroof 26s cubic-bezier(0.37,0,0.63,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
