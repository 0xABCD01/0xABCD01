<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" role="img" aria-labelledby="t d"><title id="t">Rooftop watcher</title><desc id="d">A black skyline under an ember moon. One rooftop burns with flickering flames and rising smoke, windows flicker orange, and a lone figure stands on the tallest roof, coat fluttering, watching.</desc><defs></defs><style>@keyframes tw{0%,100%{opacity:.1}50%{opacity:.45}} .tw{animation:tw 4.4s cubic-bezier(0.37,0,0.63,1) infinite}.flap{transform-box:fill-box;transform-origin:center;animation:flap .6s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}@keyframes flick{0%,100%{transform:scale(1,1) skewX(0deg)}28%{transform:scale(.95,1.12) skewX(2.5deg)}57%{transform:scale(1.04,.93) skewX(-2deg)}79%{transform:scale(.98,1.07) skewX(1deg)}} .flick{transform-box:fill-box;transform-origin:bottom center;animation:flick 1.1s linear infinite}@keyframes emberrise{0%{transform:translate(0,0);opacity:0}10%{opacity:.95}55%{transform:translate(7px,-52px)}100%{transform:translate(-5px,-104px);opacity:0}} .ember{animation:emberrise 6s linear infinite}
@keyframes winflick{0%,100%{opacity:.75}42%{opacity:.3}48%{opacity:.8}70%{opacity:.45}76%{opacity:.75}} .winflick{animation:winflick 6.4s linear infinite}
@keyframes flutter{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}} .flutter{transform-box:fill-box;transform-origin:top center;animation:flutter 3.4s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes smokerise{0%{transform:translate(0,0);opacity:.5}100%{transform:translate(16px,-26px);opacity:0}} .smokerise{animation:smokerise 7s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes crowroof{0%{transform:translate(-130px,2px)}40%{transform:translate(330px,-8px)}100%{transform:translate(1010px,0)}} .crowroof{animation:crowroof 26s cubic-bezier(0.37,0,0.63,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
