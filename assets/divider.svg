  <path class="d-d" d="M 468 18.7 C 468 20.9 469.1 22 471.3 22 C 469.1 22 468 23.1 468 25.3 C 468 23.1 466.9 22 464.7 22 C 466.9 22 468 20.9 468 18.7 Z" fill="#b8935a" opacity="0.7"/>
