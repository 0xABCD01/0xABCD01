<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="t d"><title id="t">0xABCD01 inferno banner</title><desc id="d">A black banner over a line of fire: an ember moon behind smoke, the handle written in flame gradient and glitching, embers rising, and a broad watcher silhouette on the hill whose eyes burn orange for a moment.</desc><defs><radialGradient id="moong"><stop offset="0%" stop-color="#ffb347"/><stop offset="70%" stop-color="#ff6a00"/><stop offset="100%" stop-color="#b34700"/></radialGradient><linearGradient id="firetext" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe9b0"/><stop offset="45%" stop-color="#ffb347"/><stop offset="100%" stop-color="#ff6a00"/></linearGradient></defs><style>@keyframes tw{0%,100%{opacity:.1}50%{opacity:.45}} .tw{animation:tw 4.4s cubic-bezier(0.37,0,0.63,1) infinite}.flap{transform-box:fill-box;transform-origin:center;animation:flap .6s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}@keyframes headturn{0%,38%,68%,100%{transform:translateX(0)}46%,60%{transform:translateX(3px)}} .headturn{animation:headturn 11s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes eyeglow{0%,40%,64%,100%{opacity:0}47%,58%{opacity:1}} .eyeglow{animation:eyeglow 11s cubic-bezier(0.4,0,0.2,1) infinite}@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.02)}} .breathe{transform-box:fill-box;transform-origin:bottom center;animation:breathe 5s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes flick{0%,100%{transform:scale(1,1) skewX(0deg)}28%{transform:scale(.95,1.12) skewX(2.5deg)}57%{transform:scale(1.04,.93) skewX(-2deg)}79%{transform:scale(.98,1.07) skewX(1deg)}} .flick{transform-box:fill-box;transform-origin:bottom center;animation:flick 1.1s linear infinite}@keyframes emberrise{0%{transform:translate(0,0);opacity:0}10%{opacity:.95}55%{transform:translate(7px,-52px)}100%{transform:translate(-5px,-104px);opacity:0}} .ember{