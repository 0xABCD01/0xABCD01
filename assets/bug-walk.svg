<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 96" role="img" aria-labelledby="t d"><title>Bug walk</title><desc>A small gold-and-navy bug walks a dotted path from left to right while sparkles twinkle around it.</desc>
  <style>
    @keyframes walk { 0% { transform: translateX(-56px); } 100% { transform: translateX(748px); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes wiggle { 0%, 100% { transform: rotate(9deg); } 50% { transform: rotate(-9deg); } }
    @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    @keyframes send { 0% { stroke-dashoffset: 0; opacity: 0; } 6% { opacity: 0.9; } 90% { opacity: 0.9; } 100% { stroke-dashoffset: -720; opacity: 0; } }
    @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .bug { animation: walk 16s linear infinite; }
    .bob { animation: bob 0.9s ease-in-out infinite; }
    .leg { transform-box: fill-box; transform-origin: 50% 0%; animation: wiggle 0.45s ease-in-out infinite; }
    .leg2 { animation-delay: 0.22s; }
    .ant { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 1.6s ease-in-out infinite; }
    .ant2 { animation-delay: 0.5s; }
    .tw { animation: twinkle 3.4s ease-in-out infinite; }
    .tw2 { animation-delay: 1.1s; } .tw3 { animation-delay: 2s; } .tw4 { animation-delay: 2.7s; }
    .send { animation: send 5.5s linear infinite; }
    .goal { animation: blink 2.6s ease-in-out infinite; }
  </style>

  <!-- dotted path the bug walks -->
  <line x1="0" y1="74" x2="720" y2="74" stroke="#b8935a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 9" opacity="0.55"/>
  <line class="send" x1="0" y1="74" x2="720" y2="74" stroke="#c3a36a" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="26 694" opacity="0"/>

  <!-- sparkles -->
  <path class="tw" d="M84 22 C84 25 85 26 88 26 C85 26 84 27 84 30 C84 27 83 26 80 26 C83 26 84 25 84 22 Z" fill="#c9c3d9"/>
  <path class="tw tw2" d="M238 12 C238 15 239 16 242 16 C239 16 238 17 238 20 C238 17 237 16 234 16 C237 16 238 15 238 12 Z" fill="#c3a36a"/>
  <path class="tw tw3" d="M420 20 C420 23 421 24 424 24 C421 24 420 25 420 28 C420 25 419 24 416 24 C419 24 420 23 420 20 Z" fill="#a9b9a4"/>
  <path class="tw tw4" d="M588 10 C588 13 589 14 592 14 C589 14 588 15 588 18 C588 15 587 14 584 14 C587 14 588 13 588 10 Z" fill="#c9c3d9"/>
  <path class="tw tw2" d="M668 30 C668 32.4 668.8 33.2 671.2 33.2 C668.8 33.2 668 34 668 36.4 C668 34 667.2 33.2 664.8 33.2 C667.2 33.2 668 32.4 668 30 Z" fill="#c3a36a"/>

  <!-- goal node at the end of the path -->
  <circle class="goal" cx="706" cy="74" r="4.5" fill="#c3a36a"/>

  <!-- the bug -->
  <g class="bug">
    <g class="bob">
      <!-- legs -->
      <g stroke="#20304d" stroke-width="2.2" stroke-linecap="round">
        <line class="leg" x1="14" y1="66" x2="9" y2="75"/>
        <line class="leg leg2" x1="24" y1="67" x2="22" y2="76"/>
        <line class="leg" x1="34" y1="66" x2="38" y2="75"/>
      </g>
      <!-- body -->
      <ellipse cx="24" cy="58" rx="15" ry="10.5" fill="#20304d"/>
      <path d="M12 52 a15 10.5 0 0 1 24 0" fill="#2c4066" opacity="0.85"/>
      <!-- head -->
      <circle cx="38.5" cy="55" r="6.4" fill="#b8935a"/>
      <!-- antennae -->
      <g stroke="#20304d" stroke-width="1.8" stroke-linecap="round" fill="none">
        <path class="ant" d="M41 50 q2.5 -6 6.5 -7.5"/>
        <path class="ant ant2" d="M36.5 49.5 q0.5 -6.5 4 -9"/>
      </g>
      <circle cx="47.5" cy="42.8" r="1.9" fill="#c3a36a"/>
      <circle cx="41" cy="40.2" r="1.9" fill="#c3a36a"/>
      <!-- eye -->
      <circle cx="40.5" cy="54" r="1.7" fill="#f8f1e6"/>
    </g>
  </g>
</svg>
