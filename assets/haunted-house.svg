<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 190" role="img" aria-labelledby="t d"><title id="t">Haunted house</title><desc id="d">A small haunted house: a ghost crouches, then pops up in the attic window with an overshoot; a spider drops on an elastic thread, wiggling its legs.</desc><style>@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}} .tw{animation:tw 3.4s cubic-bezier(0.37,0,0.63,1) infinite}.flap{transform-box:fill-box;transform-origin:center;animation:flap .55s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}
@keyframes peek{0%,14%{transform:translateY(27px) scale(1,1);opacity:0}20%{transform:translateY(29px) scale(1.12,.82);opacity:1}32%{transform:translateY(-4px) scale(.94,1.08);opacity:1}38%,60%{transform:translateY(0) scale(1,1);opacity:1}72%,100%{transform:translateY(27px) scale(1,1);opacity:0}} .peek{animation:peek 7s cubic-bezier(0.4,0,0.2,1) infinite}
@keyframes dangle{0%,18%{transform:translateY(0)}44%{transform:translateY(33px)}50%{transform:translateY(29px)}56%,82%{transform:translateY(31px)}100%{transform:translateY(0)}} .dangle{animation:dangle 6s cubic-bezier(0.34,1.56,0.64,1) infinite}
@keyframes legs{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}} .legs{transform-box:fill-box;transform-origin:center;animation:legs .5s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes flick{0%,100%{opacity:1}10%{opacity:.25}14%{opacity:1}52%{opacity:.35}58%{opacity:1}} .fl{animation:flick 4.4s linear infinite}
@keyframes flyh{0%{transform:translate(-40px,6px)}45%{transform:translate(120px,-8px)}100%{transform:translate(300px,2px)}} .flyh{animation:flyh 11s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes bob{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(3px,-7px) rotate(2deg)}} .bob{animation:bob 3.6s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes doorglow{0%,100%{opacity:.25}50%{opacity:.6}} .doorglow{animation:doorglow 3.6s cubic-bezier(0.37,0,0.63,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
