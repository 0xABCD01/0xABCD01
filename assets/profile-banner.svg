<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="t d"><title>0xABCD01 profile banner</title><desc>A constellation graph in navy, cream, lavender, sage, and gold. A small bug walks the graph while a trace runs along the links.</desc>  <style>
  @keyframes trace {
    0%   { stroke-dashoffset: 0;    opacity: 0; }
    6%   { opacity: 0.9; }
    88%  { opacity: 0.9; }
    100% { stroke-dashoffset: -1055; opacity: 0; }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.32; }
    50%      { opacity: 1; }
  }
  @keyframes bugmove {
    0%    { translate: 106px 332px; rotate: -25.2deg; opacity: 0; }
    2%    { translate: 106px 332px; rotate: -25.2deg; opacity: 1; }
    14.7% { translate: 246px 266px; rotate: -25.2deg; opacity: 1; }
    15.5% { translate: 246px 266px; rotate: -55.7deg; opacity: 1; }
    24.8% { translate: 306px 178px; rotate: -55.7deg; opacity: 1; }
    25.6% { translate: 306px 178px; rotate: -0.4deg;  opacity: 1; }
    55.1% { translate: 626px 176px; rotate: -0.4deg;  opacity: 1; }
    55.9% { translate: 626px 176px; rotate: -5deg;    opacity: 1; }
    82%   { translate: 909px 151px; rotate: -5deg;    opacity: 1; }
    82.8% { translate: 909px 151px; rotate: -18.1deg; opacity: 1; }
    97%   { translate: 1090px 92px; rotate: -18.1deg; opacity: 1; }
    100%  { translate: 1090px 92px; rotate: -18.1deg; opacity: 0; }
  }
  @keyframes bughop {
    0%, 13%   { translate: 0 0px;   scale: 1 1; }
    7%         { translate: 0 -5px;  scale: 1 1; }
    14.7%, 17%{ translate: 0 0px;   scale: 1.1 0.9; }
    20%        { translate: 0 -5px;  scale: 1 1; }
    24.8%, 27%{ translate: 0 0px;   scale: 1.1 0.9; }
    39%        { translate: 0 -5px;  scale: 1 1; }
    55.1%, 58%{ translate: 0 0px;   scale: 1.1 0.9; }
    69%        { translate: 0 -5px;  scale: 1 1; }
    82%, 85%  { translate: 0 0px;   scale: 1.1 0.9; }
    90%        { translate: 0 -5px;  scale: 1 1; }
    97%, 100% { translate: 0 0px;   scale: 1 1; }
  }
  @keyframes typeout {
    0%   { transform: scaleX(0); }
    60%  { transform: scaleX(1); }
    100% { transform: scaleX(1); }
  }
  @keyframes termfade {
    0%, 2%   { opacity: 0; }
    7%, 94%  { opacity: 1; }
    99%,100% { opacity: 0; }
  }
  @keyframes cursor {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .trace { animation: trace 5.2s linear infinite; }
  .tw-a { animation: twinkle 4.4s ease-in-out infinite; }
  .tw-b { animation: twinkle 5.1s ease-in-out 0.9s infinite; }
  .tw-c { animation: twinkle 6.3s ease-in-out 1.7s infinite; }
  .tw-d { animation: twinkle 5.6s ease-in-out 2.4s infinite; }
  .tw-e { animation: twinkle 4.9s ease-in-out 3.1s infinite; }
  .tw-f { animation: twinkle 6.0s ease-in-out 0.4s infinite; }

  .bug-move {
    transform-box: view-box;
    transform-origin: 0 0;
    animation: bugmove 22s linear infinite;
  }
  .bug-hop {
    transform-box: fill-box;
    transform-origin: center;
    animation: bughop 22s linear infinite;
  }

  .typer-mask {
    transform-box: fill-box;
    transform-origin: 0% 50%;
    animation: typeout 9s steps(22, end) infinite;
  }
  .term-fade { animation: termfade 9s ease-in-out infinite; }
  .cursor { animation: cursor 1.05s steps(1, end) infinite; }
  </style>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18253d" />
      <stop offset="1" stop-color="#24262b" />
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f1e6" />
      <stop offset="1" stop-color="#e8e0d5" />
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#f8f1e6" opacity="0.16" />
    </pattern>
    <clipPath id="typer">
      <rect class="typer-mask" x="99" y="161" width="226" height="24" />
    </clipPath>
  </defs>

  <rect width="1600" height="420" rx="28" fill="url(#wash)" />
  <rect x="930" y="0" width="670" height="420" fill="url(#dots)" opacity="0.5" />

  <!-- cave mouth -->
  <path d="M1010 420C1010 185 1160 48 1374 48c115 0 174 38 226 92v280z" fill="url(#cream)" opacity="0.96" />
  <path d="M1118 420c0-157 101-268 247-268 86 0 153 37 235 111v157z" fill="#c9c3d9" opacity="0.75" />
  <path d="M1244 420c0-94 63-166 147-166 79 0 147 62 209 143v23z" fill="#a9b9a4" opacity="0.82" />

  <!-- the graph -->
  <g>
    <line x1="106" y1="332" x2="626" y2="176" stroke="#c3a36a" stroke-width="3" opacity="0.9" stroke-linecap="round"/>
    <line x1="106" y1="332" x2="306" y2="178" stroke="#c3a36a" stroke-width="1.5" opacity="0.55" stroke-linecap="round"/>
    <line x1="626" y1="176" x2="628" y2="145" stroke="#f8f1e6" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
    <line x1="626" y1="176" x2="909" y2="151" stroke="#f8f1e6" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
    <line x1="909" y1="151" x2="1090" y2="92" stroke="#c3a36a" stroke-width="1.5" opacity="0.58" stroke-linecap="round"/>
    <line x1="246" y1="266" x2="306" y2="178" stroke="#f8f1e6" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
    <line x1="1340" y1="246" x2="1400" y2="300" stroke="#c3a36a" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- a trace running the links -->
  <path d="M106 332 L246 266 L306 178 L626 176 L909 151 L1090 92" fill="none" stroke="#f8f1e6" stroke-width="2.6" stroke-linecap="round"
        stroke-dasharray="16 1039" opacity="0" class="trace" />

  <g>
    <circle class="tw-a" cx="106" cy="332" r="4" fill="#c3a36a" opacity="0.95"/>
    <circle class="tw-b" cx="246" cy="266" r="10" fill="#c3a36a" opacity="1"/>
    <circle class="tw-c" cx="306" cy="178" r="7" fill="#a9b9a4" opacity="1"/>
    <circle class="tw-d" cx="626" cy="176" r="9" fill="#c9c3d9" opacity="1"/>
    <circle class="tw-e" cx="628" cy="145" r="4" fill="#f8f1e6" opacity="0.8"/>
    <circle class="tw-f" cx="909" cy="151" r="9" fill="#c9c3d9" opacity="1"/>
    <circle class="tw-a" cx="1090" cy="92" r="7" fill="#c3a36a" opacity="1"/>
    <circle class="tw-c" cx="1340" cy="246" r="8" fill="#18253d" opacity="0.7"/>
    <circle class="tw-e" cx="1400" cy="300" r="4" fill="#a9b9a4" opacity="0.85"/>
  </g>

  <!-- the bug, walking the graph -->
  <g class="bug-move">
    <g class="bug-hop">
        <g class="bug-body">
    <path d="M-9.5 -3.4 L-9.5 3.4" stroke="#c3a36a" stroke-width="2" stroke-linecap="round" />
    <ellipse cx="-2.4" cy="0" rx="7.8" ry="8.8" fill="#c3a36a" />
    <ellipse cx="-4" cy="-1.8" rx="4.9" ry="6" fill="#f8f1e6" opacity="0.22" />
    <circle cx="6.6" cy="0" r="4.9" fill="#c3a36a" />
    <path d="M9.8 -2.6 L15.2 -6.1 M9.8 2.6 L15.2 6.1" stroke="#c3a36a" stroke-width="1.8" stroke-linecap="round" />
    <path d="M-4.9 -7.4 L-9.8 -12 M-0.6 -8.8 L-2.3 -13.8 M0.9 -8.8 L3.2 -13.8" stroke="#c3a36a" stroke-width="1.7" stroke-linecap="round" />
    <path d="M-4.9 7.4 L-9.8 12 M-0.6 8.8 L-2.3 13.8 M0.9 8.8 L3.2 13.8" stroke="#c3a36a" stroke-width="1.7" stroke-linecap="round" />
    <circle cx="-2.4" cy="0" r="1.5" fill="#18253d" opacity="0.4" />
    <circle cx="8.1" cy="-1.6" r="1.3" fill="#18253d" />
  </g>
    </g>
  </g>

  <!-- handle, set in the same monospace the tools use -->
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
    <text x="101" y="112" font-size="21" letter-spacing="6.5" fill="#f8f1e6" opacity="0.82">0xABCD01</text>
    <line x1="101" y1="130" x2="392" y2="130" stroke="#f8f1e6" stroke-width="1.5" opacity="0.3" />
    <line x1="101" y1="142" x2="256" y2="142" stroke="#a9b9a4" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- a terminal line, typing itself -->
  <g class="term-fade" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
    <g clip-path="url(#typer)">
      <text x="101" y="180" font-size="16" fill="#c3a36a">$ ./recon --subs --live</text>
    </g>
    <!-- the cursor rides the typing edge -->
    <g clip-path="url(#typer)">
      <rect class="cursor" x="316" y="166" width="10" height="18" fill="#c3a36a" opacity="0.9" />
    </g>
  </g>

  <!-- sparkles -->
  <path class="tw-a" d="M 690 66.0 C 690 70.0 692.0 72 696.0 72 C 692.0 72 690 74.0 690 78.0 C 690 74.0 688.0 72 684.0 72 C 688.0 72 690 70.0 690 66.0 Z" fill="#f8f1e6" opacity="0.8"/>
  <path class="tw-c" d="M 890 272.9 C 890 276.3 891.7 278 895.1 278 C 891.7 278 890 279.7 890 283.1 C 890 279.7 888.3 278 884.9 278 C 888.3 278 890 276.3 890 272.9 Z" fill="#f8f1e6" opacity="0.75"/>
  <path class="tw-b" d="M 1460 86.9 C 1460 90.3 1461.7 92 1465.1 92 C 1461.7 92 1460 93.7 1460 97.1 C 1460 93.7 1458.3 92 1454.9 92 C 1458.3 92 1460 90.3 1460 86.9 Z" fill="#f8f1e6" opacity="0.8"/>
  <path class="tw-d" d="M 1206 115.8 C 1206 118.6 1207.4 120 1210.2 120 C 1207.4 120 1206 121.4 1206 124.2 C 1206 121.4 1204.6 120 1201.8 120 C 1204.6 120 1206 118.6 1206 115.8 Z" fill="#c3a36a" opacity="0.55"/>
  <path class="tw-e" d="M 1330 326.1 C 1330 328.7 1331.3 330 1333.9 330 C 1331.3 330 1330 331.3 1330 333.9 C 1330 331.3 1328.7 330 1326.1 330 C 1328.7 330 1330 328.7 1330 326.1 Z" fill="#c3a36a" opacity="0.45"/>
</svg>
