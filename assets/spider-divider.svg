<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 64" role="img" aria-labelledby="t d"><title id="t">Spider divider</title><desc id="d">A divider line with a spider that drops on a stretching thread, overshoots, wiggles its legs in follow-through, and climbs back up.</desc><style>@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}} .tw{animation:tw 3.4s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes drop{0%,16%{transform:translateY(0) scale(1,1)}42%{transform:translateY(28px) scale(.94,1.07)}48%{transform:translateY(24px) scale(1.07,.92)}54%,80%{transform:translateY(26px) scale(1,1)}100%{transform:translateY(0) scale(1,1)}} .drop{transform-box:fill-box;transform-origin:top center;animation:drop 8s cubic-bezier(0.34,1.56,0.64,1) infinite}
@keyframes thread{0%,16%{transform:scaleY(1)}42%,80%{transform:scaleY(3.17)}100%{transform:scaleY(1)}} .thread{transform-origin:360px 0;animation:thread 8s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes legf{0%,38%,100%{transform:rotate(0deg)}48%{transform:rotate(-7deg)}58%{transform:rotate(6deg)}68%{transform:rotate(-3deg)}} .legf{transform-box:fill-box;transform-origin:center;animation:legf 8s cubic-bezier(0.37,0,0.63,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
