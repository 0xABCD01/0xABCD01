<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="t d"><title id="t">0xABCD01 dark banner</title><desc id="d">A dark banner: a pale moon behind drifting cloud, crows crossing, a lone watcher silhouette on a hill whose head turns and whose red eyes open for a moment, and the handle glitching in slices.</desc><style>@keyframes tw{0%,100%{opacity:.12}50%{opacity:.5}} .tw{animation:tw 4.4s cubic-bezier(0.37,0,0.63,1) infinite}.flap{transform-box:fill-box;transform-origin:center;animation:flap .6s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}@keyframes headturn{0%,38%,68%,100%{transform:translateX(0)}46%,60%{transform:translateX(3px)}} .headturn{animation:headturn 11s cubic-bezier(0.37,0,0.63,1) infinite}@keyframes eyeglow{0%,40%,64%,100%{opacity:0}47%,58%{opacity:1}} .eyeglow{animation:eyeglow 11s cubic-bezier(0.4,0,0.2,1) infinite}@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.02)}} .breathe{transform-box:fill-box;transform-origin:bottom center;animation:breathe 5s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes moonglow{0%,100%{opacity:.25}50%{opacity:.55}} .mg{animation:moonglow 6s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes cloudpass{0%{transform:translateX(-30px)}100%{transform:translateX(150px)}} .cloudpass{animation:cloudpass 40s cubic-bezier(0.37,0,0.63,1) infinite alternate}
@keyframes crowfly1{0%{transform:translate(-160px,8px)}38%{transform:translate(560px,-14px)}100%{transform:translate(1760px,-30px)}} .crowfly1{animation:crowfly1 24s cubic-bezier(0.37,0,0.63,1) infinite}
@keyframes crowfly2{0%{transform:translate(-120px,0)}45%{transform:translate(760px,16px)}100%{transform:translate(1720px,-8px)}} .crowfly2{animation:crowfly2 31s cubic-bezier(0.37,0,0.63,1) infinite;animation-delay:-14s}
@keyframes gl1{0%,29%,35%,74%,80%,100%{opacity:0;transform:translateX(0)}31%,33%{opacity:.85;transform:translateX(-6px)}76%,78%{opacity:.85;transform:translateX(-4px)}} .gl1{animation:gl1 8s linear infinite}
