name: Generate snake

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff6a00&color_dots=%23e8e2d4,%234a2408,%238a3d05,%23c2510a,%23ff8a3d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff6a00&color_dots=%2316161d,%233d1e05,%237a2d05,%23c2510a,%23ff8a3d
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
